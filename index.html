<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Formation Simulator · Galaxy to Planet · OFU × ULF</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e0dcd0;font-family:'JetBrains Mono',monospace;overflow:hidden;user-select:none}
#C{position:fixed;top:0;left:0;width:100%;height:100%}

/* Top bar */
.top{position:fixed;top:0;left:0;right:0;padding:10px 16px;background:linear-gradient(to bottom,rgba(0,2,8,.95),transparent);z-index:100;text-align:center;pointer-events:none}
.top h1{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;letter-spacing:3px;
  background:linear-gradient(90deg,#ff6b6b,#FFD700 35%,#64ffc8 65%,#7b68ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top .sub{font-size:.55rem;color:#555;margin-top:3px;letter-spacing:1px}

/* Scale navigation */
.scale-nav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.scale-btn{font-family:'JetBrains Mono',monospace;font-size:.5rem;padding:4px 10px;border:1px solid #1a1a2e;background:rgba(10,10,24,.8);color:#555;cursor:pointer;border-radius:3px;transition:all .3s;text-align:right;letter-spacing:.5px}
.scale-btn:hover{border-color:#666;color:#aaa}
.scale-btn.active{border-color:#d4a54a;color:#d4a54a;background:rgba(212,165,74,.08)}

/* Info panel */
.info{position:fixed;left:14px;top:60px;z-index:100;max-width:320px;pointer-events:none}
.info .title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#d4a54a;font-weight:600;margin-bottom:6px}
.info .desc{font-size:.58rem;color:#777;line-height:1.8;margin-bottom:8px}
.info .data{font-size:.52rem;color:#555;line-height:1.7}
.info .val{color:#64ffc8}
.info .gold{color:#d4a54a}
.info .head{color:#7b68ee}

/* OFU scale ladder */
.ofu-ladder{position:fixed;left:14px;bottom:60px;z-index:100;font-size:.45rem;color:#333;pointer-events:none}
.ofu-ladder .mark{margin-bottom:3px;transition:color .5s}
.ofu-ladder .mark.lit{color:#7b68ee}

/* Bottom bar */
.bot{position:fixed;bottom:0;left:0;right:0;padding:8px 16px;background:linear-gradient(to top,rgba(0,2,8,.95),transparent);z-index:100;display:flex;justify-content:center;gap:20px;font-size:.5rem;color:#444;pointer-events:none}
.bot .g{color:#64ffc8}.bot .gold{color:#d4a54a}

/* Progress indicator */
.progress{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:8px;align-items:center}
.pdot{width:8px;height:8px;border-radius:50%;border:1px solid #333;transition:all .4s;cursor:pointer;pointer-events:auto}
.pdot.active{background:#d4a54a;border-color:#d4a54a;transform:scale(1.3)}
.pdot:hover{border-color:#888}

/* Transition overlay */
.trans{position:fixed;inset:0;background:#000;z-index:200;opacity:0;pointer-events:none;transition:opacity .6s}
.trans.show{opacity:1}
</style>
</head>
<body>
<div id="C"></div>
<div class="trans" id="trans"></div>

<div class="top">
  <h1>COSMIC FORMATION SIMULATOR</h1>
  <div class="sub">OFU SCALE LADDER × ULF FREQUENCY ORGANIZATION · FROM GALAXY TO PLANET · LEWIS × LEHTO 2026</div>
</div>

<div class="scale-nav" id="scaleNav">
  <button class="scale-btn active" onclick="goScale(0)">GALAXY · 10²¹m</button>
  <button class="scale-btn" onclick="goScale(1)">CLOUD · 10¹⁶m</button>
  <button class="scale-btn" onclick="goScale(2)">DISK · 10¹³m</button>
  <button class="scale-btn" onclick="goScale(3)">FORMATION · 10¹²m</button>
  <button class="scale-btn" onclick="goScale(4)">SYSTEM · 10¹¹m</button>
</div>

<div class="info" id="info"></div>

<div class="ofu-ladder" id="ofuLadder"></div>

<div class="progress" id="progress"></div>

<div class="bot">
  <span>SCROLL or click scale buttons to navigate</span>
  <span>|</span>
  <span><span class="gold">OFU</span>: Cosmic Octaves · 10²⁴ scale jumps</span>
  <span>|</span>
  <span><span class="g">ULF</span>: E=hf · Frequency organizes structure</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
// CONSTANTS & DATA
// ══════════════════════════════════════════════════════════════════
const SCALES = [
  {name:"The Galaxy",logR:21,
   desc:"The Milky Way: a spinning electromagnetic system threaded with magnetic fields. SPICE-RACS DR2 mapped this field using Faraday rotation of 250,000 radio sources — the most detailed magnetic map ever made.",
   data:"B at solar radius: 6 μG · Inner/outer RM gradient: 6.9× · Best-fit E∝f^n: n≈1.0 · Orbital frequency at Sun: 7.5×10⁻¹⁶ Hz",
   physics:"Galactic magnetic field → molecular cloud initial conditions → angular momentum budget via magnetic braking"},
  {name:"Cloud Collapse",logR:16,
   desc:"A molecular cloud inherits angular momentum from galactic rotation. As it collapses under gravity, magnetic braking removes spin — but not all of it. The remaining angular momentum flattens the cloud into a disk. The galaxy pulls the ripcord.",
   data:"Cloud mass: ~1-2 M☉ · Collapse time: ~10⁵ yr · Magnetic braking efficiency: ~90% · Residual angular momentum → disk",
   physics:"Magnetic braking (electromagnetic) → angular momentum transport → disk mass and radius determined"},
  {name:"Protoplanetary Disk",logR:13,
   desc:"A spinning, magnetically-threaded disk of gas and dust. Three frequency boundaries emerge: the dead zone (ionization boundary), the snow line (thermal boundary), and pressure bumps at each edge. These boundaries are where planets will form.",
   data:"Σ₀=2650 g/cm² · B(1AU)=29 mG · Snow line: 3.98 AU · Dead zone: 0.1–18.5 AU · α=1.3×10⁻³ · Disk mass: 0.016 M☉",
   physics:"B-field → MRI → dead zone → pressure bumps → dust trapping at frequency boundaries"},
  {name:"Planet Formation",logR:12,
   desc:"Material accumulates at the three frequency boundaries. Rocky planets form at the inner disk edge and convergence radius. Gas giants form at the snow line. Ice giants form at the dead zone outer edge. The beyblade spins — the architecture freezes in.",
   data:"Rocky zone: 0.39–1.53 AU · Gas anchor: 5.19 AU (snow line × 1.3) · Ice anchor: 19.1 AU (DZ outer × 1.03) · Migration: 8%",
   physics:"Pressure bumps trap dust → planetesimals → planets · Three harmonic ratios: 1.877 / 1.830 / 1.560"},
  {name:"The Solar System",logR:11,
   desc:"Eight planets, placed by disk physics to 99.6% accuracy. The same spacing ratios — resonance capture and Hill sphere packing — reproduce planetary architecture across 8 other stellar systems from M-dwarfs to A-stars. Frequency organizes structure.",
   data:"Match: 99.6% · χ²=0.000002 · All planets <1% error · Validated blind on 43 planets in 8 systems · 86% of ratios within 10%",
   physics:"As above, so below. The frequency thread: galaxy → disk → orbits → biology · Still spinning."},
];

// SPICE-RACS longitude profile (real data, 2° bins)
const RM_PROFILE=[44,50,55,65,80,100,122,140,155,170,185,180,160,140,110,80,60,45,35,28,23,20,22,25,30,40,50,60,75,85,95,100,110,120,131,140,130,115,100,85,70,60,50,44,42,40,38,37,36,35,34,33,32,31,30,29,28,27,26,25,24,23,24,25,27,30,35,42,50,60,70,80,90,100,110,120,130,125,110,95,80,65,55,48,44,42,41,40,42,44];

// Planet data
const PLANETS=[
  {name:"Mercury",au:0.387,pred:0.390,color:"#aaaaaa",r:0.15,type:"Rocky"},
  {name:"Venus",au:0.723,pred:0.727,color:"#e8c06a",r:0.25,type:"Rocky"},
  {name:"Earth",au:1.000,pred:1.004,color:"#4488cc",r:0.25,type:"Rocky"},
  {name:"Mars",au:1.524,pred:1.529,color:"#cc5533",r:0.18,type:"Rocky"},
  {name:"Jupiter",au:5.203,pred:5.187,color:"#ddaa66",r:0.6,type:"Gas"},
  {name:"Saturn",au:9.537,pred:9.514,color:"#ccbb77",r:0.5,type:"Gas"},
  {name:"Uranus",au:19.19,pred:19.162,color:"#88ccdd",r:0.35,type:"Ice"},
  {name:"Neptune",au:30.07,pred:30.011,color:"#3366cc",r:0.35,type:"Ice"},
];

// OFU Scale Ladder
const OFU_MARKS=[
  {name:"Proton",logR:-15},{name:"Atom",logR:-10},{name:"Ribosome",logR:-8},
  {name:"Cell",logR:-6},{name:"Worm",logR:-3},{name:"Human",logR:0},
  {name:"City",logR:3},{name:"Earth",logR:7},{name:"Sun",logR:9},
  {name:"Solar Sys",logR:13},{name:"Cluster",logR:17},{name:"Bubble",logR:19},
  {name:"Galaxy",logR:21},{name:"Supercluster",logR:24},{name:"Universe",logR:27},
];

// ══════════════════════════════════════════════════════════════════
// THREE.JS SETUP
// ══════════════════════════════════════════════════════════════════
let scene, camera, renderer;
let currentScale = 0, targetScale = 0, transitioning = false;
let time = 0;
let sceneGroups = [];
let camTheta=0, camPhi=0.7, camDist=40;
let tTheta=0, tPhi=0.7, tDist=40;
let dragging=false, lastM={x:0,y:0};
let autoRotate = true;

function init(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 1000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000208);
  document.getElementById('C').appendChild(renderer.domElement);

  // Create all 5 scale scenes
  for(let i=0;i<5;i++){
    const g = new THREE.Group();
    g.visible = i === 0;
    scene.add(g);
    sceneGroups.push(g);
  }

  buildGalaxy(sceneGroups[0]);
  buildCloud(sceneGroups[1]);
  buildDisk(sceneGroups[2]);
  buildFormation(sceneGroups[3]);
  buildSystem(sceneGroups[4]);
  buildStarfield();

  // Events
  renderer.domElement.addEventListener('mousedown',e=>{dragging=true;lastM={x:e.clientX,y:e.clientY}});
  renderer.domElement.addEventListener('mouseup',()=>dragging=false);
  renderer.domElement.addEventListener('mousemove',onMM);
  renderer.domElement.addEventListener('wheel',onWheel,{passive:false});
  renderer.domElement.addEventListener('touchstart',e=>{dragging=true;lastM={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()},{passive:false});
  renderer.domElement.addEventListener('touchmove',e=>{if(dragging){const dx=e.touches[0].clientX-lastM.x,dy=e.touches[0].clientY-lastM.y;tTheta-=dx*.005;tPhi=Math.max(.05,Math.min(Math.PI-.05,tPhi+dy*.005));lastM={x:e.touches[0].clientX,y:e.touches[0].clientY}}e.preventDefault()},{passive:false});
  renderer.domElement.addEventListener('touchend',()=>dragging=false);
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

  updateInfo();
  buildProgressDots();
  buildOFULadder();
  animate();
}

function onMM(e){
  if(dragging){
    tTheta-=(e.clientX-lastM.x)*.005;
    tPhi=Math.max(.05,Math.min(Math.PI-.05,tPhi+(e.clientY-lastM.y)*.005));
    lastM={x:e.clientX,y:e.clientY};
    autoRotate=false;
  }
}

function onWheel(e){
  // Scroll changes scale
  if(Math.abs(e.deltaY)>50){
    if(e.deltaY>0 && currentScale<4) goScale(currentScale+1);
    else if(e.deltaY<0 && currentScale>0) goScale(currentScale-1);
  }
  e.preventDefault();
}

// ══════════════════════════════════════════════════════════════════
// SCALE TRANSITIONS
// ══════════════════════════════════════════════════════════════════
function goScale(idx){
  if(idx===currentScale||transitioning)return;
  transitioning=true;
  const tr=document.getElementById('trans');
  tr.classList.add('show');

  setTimeout(()=>{
    sceneGroups[currentScale].visible=false;
    currentScale=idx;
    sceneGroups[currentScale].visible=true;

    // Set camera for each scale
    const cams=[
      {th:0,ph:.6,d:35},    // galaxy
      {th:.5,ph:.8,d:20},   // cloud
      {th:0,ph:.5,d:30},    // disk
      {th:.3,ph:.6,d:25},   // formation
      {th:0,ph:.4,d:40},    // system
    ];
    tTheta=cams[idx].th; tPhi=cams[idx].ph; tDist=cams[idx].d;
    camTheta=tTheta; camPhi=tPhi; camDist=tDist;
    autoRotate=true;

    updateInfo();
    updateScaleNav();
    updateProgressDots();
    updateOFULadder();

    tr.classList.remove('show');
    setTimeout(()=>transitioning=false, 600);
  }, 600);
}
window.goScale=goScale;

// ══════════════════════════════════════════════════════════════════
// SCENE BUILDERS
// ══════════════════════════════════════════════════════════════════

function buildStarfield(){
  const g=new THREE.BufferGeometry(),n=5000,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=80+Math.random()*120;
    p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.sin(ph)*Math.sin(th);p[i*3+2]=r*Math.cos(ph)}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.1,transparent:true,opacity:.4})));
}

// ── GALAXY ──
function buildGalaxy(group){
  const N=80000, pitch=12*Math.PI/180, arms=4;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3),col=new Float32Array(N*3);

  for(let i=0;i<N;i++){
    let r,th;
    if(Math.random()<.15){r=Math.random()*15;th=Math.random()*Math.PI*2}
    else{const arm=Math.floor(Math.random()*arms);const ao=arm/arms*Math.PI*2;
      const t=Math.random();r=.5+t*14.5;th=ao+Math.log(r/.5)/Math.tan(pitch)+(Math.random()-.5)*(.3+r*.04)}
    const z=(Math.random()-.5)*.5*Math.exp(-r/4);
    pos[i*3]=r*Math.cos(th);pos[i*3+1]=z;pos[i*3+2]=r*Math.sin(th);

    // Color by RM profile (real SPICE-RACS data mapped to azimuth)
    const l=((Math.atan2(r*Math.sin(th),r*Math.cos(th))*180/Math.PI)+360)%360;
    const rmIdx=Math.floor(l/4)%90;
    const rm=RM_PROFILE[rmIdx]||50;
    const t2=Math.min(rm/200,1);
    col[i*3]=t2<.4?t2*.5:.2+(t2-.4)*1.3;
    col[i*3+1]=t2<.3?t2*1.2:t2<.6?.36+(t2-.3)*1.2:.8-(t2-.6)*1.5;
    col[i*3+2]=t2<.3?.7-t2*1.5:t2<.5?.25-(t2-.3)*.6:.05;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  group.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false})));

  // Bulge
  const bN=10000,bg=new THREE.BufferGeometry(),bp=new Float32Array(bN*3),bc=new Float32Array(bN*3);
  for(let i=0;i<bN;i++){const r=Math.pow(Math.random(),.5)*1.5;const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    bp[i*3]=r*Math.sin(ph)*Math.cos(th);bp[i*3+1]=r*Math.cos(ph)*.6;bp[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const br=.8+.2*(1-r/1.5);bc[i*3]=br;bc[i*3+1]=.85*br;bc[i*3+2]=.5*br}
  bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
  bg.setAttribute('color',new THREE.BufferAttribute(bc,3));
  group.add(new THREE.Points(bg,new THREE.PointsMaterial({size:.04,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})));

  // Solar position
  const sm=new THREE.Mesh(new THREE.SphereGeometry(.1,16,16),new THREE.MeshBasicMaterial({color:0xFFD700}));
  sm.position.set(8.5,0,0);group.add(sm);

  // Scale rings
  [3,5,8.5,12,15].forEach(r=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(r-.02,r+.02,96),new THREE.MeshBasicMaterial({color:r===8.5?0xFFD700:0x222233,side:THREE.DoubleSide,transparent:true,opacity:r===8.5?.25:.1}));
    ring.rotation.x=-Math.PI/2;group.add(ring)});

  // Field lines
  for(let i=0;i<40;i++){
    const arm=i%4,ao=arm/4*Math.PI*2,rS=1+Math.random()*13;
    const pts=[];
    for(let s=0;s<80;s++){const t=s/80,r=rS+(t-.5)*5;if(r<.5||r>16)continue;
      const th2=ao+Math.log(r/.5)/Math.tan(pitch)+Math.sin(s*.15+i*1.7)*.12;
      const z2=Math.sin(s*.08+i*2.3)*.12*Math.exp(-r/6);
      pts.push(new THREE.Vector3(r*Math.cos(th2),z2,r*Math.sin(th2)))}
    if(pts.length<2)continue;
    const lg=new THREE.BufferGeometry().setFromPoints(pts);
    const lm=new THREE.LineBasicMaterial({color:0xd4a54a,transparent:true,opacity:.12,blending:THREE.AdditiveBlending});
    group.add(new THREE.Line(lg,lm));
  }
}

// ── CLOUD COLLAPSE ──
function buildCloud(group){
  const N=30000,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    // Elongated cloud with turbulent structure
    const r=Math.pow(Math.random(),.3)*12;
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    const stretch=1+Math.sin(th*3+ph*2)*.3; // turbulent shape
    pos[i*3]=r*Math.sin(ph)*Math.cos(th)*stretch;
    pos[i*3+1]=r*Math.cos(ph)*.7;
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th)*stretch;
    // Dark cloud colors with warm core
    const dist=r/12;
    col[i*3]=.15+.4*(1-dist);col[i*3+1]=.1+.2*(1-dist);col[i*3+2]=.2+.3*dist;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  group.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.08,vertexColors:true,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false})));

  // Magnetic field lines through cloud (parallel, representing ambient galactic field)
  for(let i=0;i<15;i++){
    const pts=[];
    const y0=(i-7)*1.5, z0=(Math.random()-.5)*8;
    for(let x=-14;x<=14;x+=.5){
      const wobble=Math.sin(x*.3+i)*(.5+Math.abs(x)*.02);
      pts.push(new THREE.Vector3(x,y0+wobble,z0+Math.cos(x*.2+i)*.3))}
    const lg=new THREE.BufferGeometry().setFromPoints(pts);
    group.add(new THREE.Line(lg,new THREE.LineBasicMaterial({color:0x7b68ee,transparent:true,opacity:.15})));
  }

  // Glowing core (proto-star forming)
  const core=new THREE.Mesh(new THREE.SphereGeometry(1,32,32),new THREE.MeshBasicMaterial({color:0xFFAA33,transparent:true,opacity:.3}));
  group.add(core);
  const coreGlow=new THREE.Mesh(new THREE.SphereGeometry(2,32,32),new THREE.MeshBasicMaterial({color:0xFF6622,transparent:true,opacity:.08}));
  group.add(coreGlow);
}

// ── PROTOPLANETARY DISK ──
function buildDisk(group){
  const N=40000,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3),col=new Float32Array(N*3);

  for(let i=0;i<N;i++){
    let r,th;
    r=.3+Math.random()*20;
    th=Math.random()*Math.PI*2;
    const z=(Math.random()-.5)*.4*Math.exp(-r/8);
    pos[i*3]=r*Math.cos(th);pos[i*3+1]=z;pos[i*3+2]=r*Math.sin(th);

    // Color by zone
    if(r<1.53){col[i*3]=.7;col[i*3+1]=.35;col[i*3+2]=.2} // rocky zone - warm
    else if(r<3.98){col[i*3]=.4;col[i*3+1]=.25;col[i*3+2]=.15} // gap / asteroid zone
    else if(r<6){col[i*3]=.6;col[i*3+1]=.55;col[i*3+2]=.3} // gas giant zone - golden
    else if(r<14){col[i*3]=.3;col[i*3+1]=.35;col[i*3+2]=.4} // mid disk - cool
    else{col[i*3]=.2;col[i*3+1]=.35;col[i*3+2]=.6} // ice zone - blue
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  group.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false})));

  // Proto-sun
  const sun=new THREE.Mesh(new THREE.SphereGeometry(.25,32,32),new THREE.MeshBasicMaterial({color:0xFFDD44}));
  group.add(sun);
  group.add(new THREE.Mesh(new THREE.SphereGeometry(.4,32,32),new THREE.MeshBasicMaterial({color:0xFFAA22,transparent:true,opacity:.15})));

  // Frequency boundary rings
  const boundaries=[
    {r:0.39,color:0xff6b6b,label:"Inner edge"},
    {r:1.01,color:0xff6b6b,label:"Convergence"},
    {r:1.53,color:0xff6b6b,label:"Truncation"},
    {r:3.98,color:0x4488cc,label:"Snow line"},
    {r:18.5,color:0x7b68ee,label:"DZ outer"},
  ];
  boundaries.forEach(b=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(b.r-.04,b.r+.04,128),
      new THREE.MeshBasicMaterial({color:b.color,side:THREE.DoubleSide,transparent:true,opacity:.3}));
    ring.rotation.x=-Math.PI/2;group.add(ring);
  });

  // Dead zone shading
  const dzGeo=new THREE.RingGeometry(0.1,18.5,128);
  const dzMat=new THREE.MeshBasicMaterial({color:0xff6b6b,side:THREE.DoubleSide,transparent:true,opacity:.03});
  const dz=new THREE.Mesh(dzGeo,dzMat);dz.rotation.x=-Math.PI/2;group.add(dz);

  // Magnetic field spiral lines through disk
  for(let i=0;i<20;i++){
    const pts=[],ao=i/20*Math.PI*2;
    for(let s=0;s<60;s++){const t=s/60,r=.5+t*19;
      const th2=ao+t*3*Math.PI+Math.sin(s*.1+i)*.1;
      const z2=Math.sin(s*.15+i*2)*.1*Math.exp(-r/10);
      pts.push(new THREE.Vector3(r*Math.cos(th2),z2,r*Math.sin(th2)))}
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0xd4a54a,transparent:true,opacity:.08,blending:THREE.AdditiveBlending})));
  }
}

// ── FORMATION ──
function buildFormation(group){
  // Disk particles concentrating at boundaries
  const N=25000,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3),col=new Float32Array(N*3);

  for(let i=0;i<N;i++){
    let r=.2+Math.random()*22,th=Math.random()*Math.PI*2;
    // Concentrate particles at formation zones
    const zones=[0.39,0.72,1.0,1.53,5.19,9.51,19.1,30.0];
    if(Math.random()<.6){const z=zones[Math.floor(Math.random()*zones.length)];r=z+(Math.random()-.5)*z*.3}
    const z=(Math.random()-.5)*.2*Math.exp(-r/10);
    pos[i*3]=r*Math.cos(th);pos[i*3+1]=z;pos[i*3+2]=r*Math.sin(th);

    if(r<2){col[i*3]=.8;col[i*3+1]=.4;col[i*3+2]=.25}
    else if(r<7){col[i*3]=.7;col[i*3+1]=.6;col[i*3+2]=.3}
    else{col[i*3]=.3;col[i*3+1]=.5;col[i*3+2]=.7}
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  group.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false})));

  // Proto-sun
  group.add(new THREE.Mesh(new THREE.SphereGeometry(.3,32,32),new THREE.MeshBasicMaterial({color:0xFFDD44})));

  // Proto-planets forming at each zone
  PLANETS.forEach(p=>{
    const geo2=new THREE.SphereGeometry(p.r*.4,16,16);
    const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.color),transparent:true,opacity:.7});
    const mesh=new THREE.Mesh(geo2,mat);
    const angle=Math.random()*Math.PI*2;
    mesh.position.set(p.au*Math.cos(angle),0,p.au*Math.sin(angle));
    group.add(mesh);

    // Accumulation ring
    const ring=new THREE.Mesh(new THREE.RingGeometry(p.au-.1,p.au+.1,96),
      new THREE.MeshBasicMaterial({color:new THREE.Color(p.color),side:THREE.DoubleSide,transparent:true,opacity:.15}));
    ring.rotation.x=-Math.PI/2;group.add(ring);
  });
}

// ── SOLAR SYSTEM RESULT ──
function buildSystem(group){
  // Sun
  const sun=new THREE.Mesh(new THREE.SphereGeometry(.5,32,32),new THREE.MeshBasicMaterial({color:0xFFDD44}));
  group.add(sun);
  group.add(new THREE.Mesh(new THREE.SphereGeometry(.8,32,32),new THREE.MeshBasicMaterial({color:0xFFAA22,transparent:true,opacity:.12})));

  // Planets with actual and predicted positions
  PLANETS.forEach((p,i)=>{
    // Actual orbit
    const oGeo=new THREE.RingGeometry(p.au-.03,p.au+.03,128);
    const oMat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.color),side:THREE.DoubleSide,transparent:true,opacity:.2});
    const orbit=new THREE.Mesh(oGeo,oMat);orbit.rotation.x=-Math.PI/2;group.add(orbit);

    // Predicted orbit (green)
    const pGeo=new THREE.RingGeometry(p.pred-.05,p.pred+.05,128);
    const pMat=new THREE.MeshBasicMaterial({color:0x64ffc8,side:THREE.DoubleSide,transparent:true,opacity:.15});
    const predOrbit=new THREE.Mesh(pGeo,pMat);predOrbit.rotation.x=-Math.PI/2;group.add(predOrbit);

    // Planet
    const angle=Math.random()*Math.PI*2+(i*Math.PI/4);
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(p.r*.35,16,16),new THREE.MeshBasicMaterial({color:new THREE.Color(p.color)}));
    mesh.position.set(p.au*Math.cos(angle),0,p.au*Math.sin(angle));
    mesh._angle=angle;mesh._planet=p;
    group.add(mesh);

    // Label
    const cv=document.createElement('canvas');cv.width=128;cv.height=24;
    const cx=cv.getContext('2d');cx.font='11px JetBrains Mono';
    cx.fillStyle=p.type==="Rocky"?'#ff6b6b':p.type==="Gas"?'#FFD700':'#7b68ee';
    const err=Math.abs(p.pred-p.au)/p.au*100;
    cx.fillText(p.name+' '+err.toFixed(1)+'%',2,16);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
    sp.position.set(p.au*Math.cos(angle),0.8,p.au*Math.sin(angle));
    sp.scale.set(3,.6,1);group.add(sp);
  });

  // Zone boundary markers
  [{r:3.98,c:0x4488cc,l:"Snow Line"},{r:18.5,c:0x7b68ee,l:"DZ Outer"}].forEach(z=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(z.r-.06,z.r+.06,128),
      new THREE.MeshBasicMaterial({color:z.c,side:THREE.DoubleSide,transparent:true,opacity:.1}));
    ring.rotation.x=-Math.PI/2;group.add(ring);
  });
}

// ══════════════════════════════════════════════════════════════════
// UI UPDATES
// ══════════════════════════════════════════════════════════════════
function updateInfo(){
  const s=SCALES[currentScale];
  document.getElementById('info').innerHTML=`
    <div class="title">${s.name}</div>
    <div class="desc">${s.desc}</div>
    <div class="data">
      <span class="val">${s.data}</span><br><br>
      <span class="gold">PHYSICS:</span> <span style="color:#888">${s.physics}</span>
    </div>`;
}

function updateScaleNav(){
  document.querySelectorAll('.scale-btn').forEach((btn,i)=>{
    btn.classList.toggle('active',i===currentScale);
  });
}

function buildProgressDots(){
  const el=document.getElementById('progress');
  for(let i=0;i<5;i++){
    const dot=document.createElement('div');
    dot.className='pdot'+(i===0?' active':'');
    dot.onclick=()=>goScale(i);
    el.appendChild(dot);
  }
}

function updateProgressDots(){
  document.querySelectorAll('.pdot').forEach((d,i)=>d.classList.toggle('active',i===currentScale));
}

function buildOFULadder(){
  const el=document.getElementById('ofuLadder');
  el.innerHTML='<div style="color:#7b68ee44;margin-bottom:4px">OFU LADDER</div>';
  OFU_MARKS.forEach(m=>{
    el.innerHTML+=`<div class="mark" data-logr="${m.logR}">${m.name} · 10^${m.logR}</div>`;
  });
}

function updateOFULadder(){
  const targetLogR=SCALES[currentScale].logR;
  document.querySelectorAll('.ofu-ladder .mark').forEach(m=>{
    const lr=parseFloat(m.dataset.logr);
    m.classList.toggle('lit',Math.abs(lr-targetLogR)<3);
  });
}

// ══════════════════════════════════════════════════════════════════
// ANIMATION
// ══════════════════════════════════════════════════════════════════
function animate(){
  requestAnimationFrame(animate);
  time+=.016;

  // Smooth camera
  camTheta+=(tTheta-camTheta)*.06;
  camPhi+=(tPhi-camPhi)*.06;
  camDist+=(tDist-camDist)*.06;
  if(autoRotate&&!dragging) tTheta+=.001;

  camera.position.set(
    camDist*Math.sin(camPhi)*Math.cos(camTheta),
    camDist*Math.cos(camPhi),
    camDist*Math.sin(camPhi)*Math.sin(camTheta)
  );
  camera.lookAt(0,0,0);

  // Per-scale animations
  if(currentScale===0) animateGalaxy();
  if(currentScale===1) animateCloud();
  if(currentScale===2) animateDisk();
  if(currentScale===3) animateFormation();
  if(currentScale===4) animateSystem();

  renderer.render(scene,camera);
}

function animateGalaxy(){
  const g=sceneGroups[0];if(!g.visible)return;
  const pts=g.children[0];if(!pts||!pts.geometry)return;
  const pos=pts.geometry.attributes.position.array;
  for(let i=0;i<pos.length/3;i+=10){
    const x=pos[i*3],z=pos[i*3+2],r=Math.sqrt(x*x+z*z);
    const w=.0002/(0.5+r*.1);
    pos[i*3]=x*Math.cos(w)-z*Math.sin(w);
    pos[i*3+2]=x*Math.sin(w)+z*Math.cos(w);
  }
  pts.geometry.attributes.position.needsUpdate=true;
}

function animateCloud(){
  const g=sceneGroups[1];if(!g.visible)return;
  // Slow rotation and gentle collapse animation
  g.rotation.y+=.0005;
  const pts=g.children[0];if(!pts||!pts.geometry)return;
  const pos=pts.geometry.attributes.position.array;
  for(let i=0;i<pos.length/3;i+=8){
    const x=pos[i*3],y=pos[i*3+1],z=pos[i*3+2];
    const r=Math.sqrt(x*x+y*y+z*z);
    // Very gentle inward drift
    const drift=.00005*r;
    pos[i*3]-=x/r*drift;pos[i*3+1]-=y/r*drift*.5;pos[i*3+2]-=z/r*drift;
  }
  pts.geometry.attributes.position.needsUpdate=true;
}

function animateDisk(){
  const g=sceneGroups[2];if(!g.visible)return;
  const pts=g.children[0];if(!pts||!pts.geometry)return;
  const pos=pts.geometry.attributes.position.array;
  for(let i=0;i<pos.length/3;i+=6){
    const x=pos[i*3],z=pos[i*3+2],r=Math.sqrt(x*x+z*z);
    const w=.0003/(0.5+r*.05);
    pos[i*3]=x*Math.cos(w)-z*Math.sin(w);
    pos[i*3+2]=x*Math.sin(w)+z*Math.cos(w);
  }
  pts.geometry.attributes.position.needsUpdate=true;
}

function animateFormation(){
  const g=sceneGroups[3];if(!g.visible)return;
  const pts=g.children[0];if(!pts||!pts.geometry)return;
  const pos=pts.geometry.attributes.position.array;
  for(let i=0;i<pos.length/3;i+=4){
    const x=pos[i*3],z=pos[i*3+2],r=Math.sqrt(x*x+z*z);
    const w=.0004/(0.5+r*.04);
    pos[i*3]=x*Math.cos(w)-z*Math.sin(w);
    pos[i*3+2]=x*Math.sin(w)+z*Math.cos(w);
  }
  pts.geometry.attributes.position.needsUpdate=true;
}

function animateSystem(){
  // Orbit planets at Keplerian speeds (visual: Mercury ~8 sec/orbit, Neptune ~minutes)
  const g=sceneGroups[4];if(!g.visible)return;
  g.children.forEach(c=>{
    if(c._planet){
      // ω ∝ a^(-3/2) — Kepler's third law
      // 0.003 base rate gives Mercury ~8 sec orbit at 60fps
      c._angle += 0.003 / Math.pow(c._planet.au, 1.5);
      c.position.set(c._planet.au*Math.cos(c._angle), 0, c._planet.au*Math.sin(c._angle));
    }
  });
}
